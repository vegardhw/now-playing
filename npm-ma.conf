location /api/ma/ {
    # Rewrite path to remove /api/ma prefix, and inject the MA access token
    # as a query-string parameter (MA authenticates the WebSocket/REST calls
    # via ?access_token=..., not an Authorization header like HA does).
    # The trailing "&$args" preserves any existing query args the client
    # sent (e.g. imageproxy's ?path=...&provider=...); it's harmless when
    # $args is empty (e.g. the /ws handshake has none).
    rewrite ^/api/ma/(.*)$ /$1?access_token=<MA_TOKEN_HERE>&$args break;

    # Proxy to Music Assistant
    proxy_pass http://10.0.1.10:8095;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (required - this is a real, persistent connection
    # for MA, unlike the HA config where it's currently unused boilerplate)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeout settings - the MA WebSocket is long-lived. The app polls every
    # ~5s which normally keeps it under the default 60s read timeout, but
    # background tab throttling (mobile browsers, kiosk displays) can pause
    # that timer, so use a much longer read/send timeout to avoid nginx
    # dropping an idle-but-still-open connection.
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}
