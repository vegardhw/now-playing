location /api/ma/ {
    # Rewrite path to remove /api/ma prefix. MA's real endpoints (/ws,
    # /imageproxy) live at the server root, unlike HA which keeps its /api
    # prefix.
    rewrite ^/api/ma/(.*)$ /$1 break;

    # Proxy to Music Assistant
    proxy_pass http://10.0.1.10:8095;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (required - this is a real, persistent connection
    # for MA, unlike the HA config where it's currently unused boilerplate).
    # Note: this proxy only handles routing/upgrade. Music Assistant's
    # WebSocket auth requires an in-band "auth" command sent by the client
    # after connecting, which a reverse proxy cannot inject -- the PAT must
    # be configured client-side in now-playing-ma.html (MA_ACCESS_TOKEN).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeout settings - the MA WebSocket is long-lived. The app polls every
    # ~5s which normally keeps it under the default 60s read timeout, but
    # background tab throttling (mobile browsers, kiosk displays) can pause
    # that timer, so use a much longer read/send timeout to avoid nginx
    # dropping an idle-but-still-open connection.
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}
