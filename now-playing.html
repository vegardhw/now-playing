<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Playing</title>

  <script>
    // ============================================
    // CONFIGURATION - Edit these values as needed
    // ============================================

    // Set to true to use test data without Home Assistant connection
    const DEV_MODE = true;

    // Home Assistant media player entity ID
    const MEDIA_PLAYER = 'media_player.sonos_roam';

    // NGINX proxy path for Home Assistant API
    const API_PATH = '/ha-api';

    // ============================================
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Blurred album art background */
    .background-blur {
      position: fixed;
      top: -10%;
      left: -10%;
      right: -10%;
      bottom: -10%;
      z-index: 0;
      overflow: hidden;
    }

    .background-blur img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(60px) saturate(1.4) brightness(0.6);
      transform: scale(1.1);
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .background-blur img.visible {
      opacity: 0.6;
    }

    /* Subtle slow-moving animation for the background */
    .background-blur img.visible {
      animation: slowDrift 30s ease-in-out infinite;
    }

    @keyframes slowDrift {
      0%, 100% { transform: scale(1.1) translate(0, 0); }
      25% { transform: scale(1.15) translate(2%, -1%); }
      50% { transform: scale(1.1) translate(-1%, 2%); }
      75% { transform: scale(1.12) translate(-2%, -1%); }
    }

    /* Dark overlay for better contrast */
    .background-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
      z-index: 0;
    }

    /* Main content container */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 90vw;
      padding: 20px;
    }

    /* Album art container */
    .artwork-container {
      width: min(50vh, 80vw);
      height: min(50vh, 80vw);
      margin: 0 auto 40px;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      background: #1a1a1a;
    }

    .artwork-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .artwork-container img.loaded {
      opacity: 1;
    }

    /* Track info */
    .track-title {
      font-size: clamp(24px, 4vw, 48px);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      line-height: 1.2;
      opacity: 0;
      transition: opacity 0.5s ease 0.2s;
    }

    .track-title.visible {
      opacity: 1;
    }

    .track-artist {
      font-size: clamp(18px, 3vw, 32px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.5s ease 0.3s;
    }

    .track-artist.visible {
      opacity: 1;
    }

    .track-album {
      font-size: clamp(16px, 2.5vw, 26px);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.65);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.5s ease 0.4s;
    }

    .track-album.visible {
      opacity: 1;
    }

    /* Loading state */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 18px;
    }

    /* Error state */
    .error-message {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 0, 0, 0.2);
      border: 1px solid rgba(255, 0, 0, 0.5);
      color: #fff;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      z-index: 1000;
    }

    .error-message.visible {
      display: block;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }

      .artwork-container {
        margin-bottom: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="background-blur" id="backgroundBlur">
    <img id="backgroundArt" alt="">
  </div>
  <div class="background-overlay"></div>

  <div class="container">
    <div class="artwork-container">
      <img id="artwork" alt="Album artwork" crossorigin="anonymous">
    </div>
    <div class="track-title" id="title">Track title</div>
    <div class="track-artist" id="artist">Artist</div>
    <div class="track-album" id="album">Album title</div>
  </div>

  <div class="error-message" id="errorMessage"></div>

  <script>
    // CONFIGURATION - Update these values
    // Internal configuration (uses values from top of file)
    const CONFIG = {
      API_PATH: API_PATH,
      ENTITY: MEDIA_PLAYER,
      UPDATE_INTERVAL: 2000, // milliseconds
      RETRY_DELAY: 5000, // milliseconds on error

      // Development mode - uses value from top of file
      DEV_MODE: DEV_MODE,
      DEV_DATA: {
        title: 'Test Track Title',
        artist: 'Test Artist',
        album: 'Test Album',
        // Using a public domain album art for testing
        artwork: 'https://picsum.photos/seed/jazz/500/500'
      }
    };

    // State management
    let currentTrack = null;
    let updateTimer = null;
    let isUpdating = false;

    // DOM elements
    const elements = {
      artwork: document.getElementById('artwork'),
      title: document.getElementById('title'),
      artist: document.getElementById('artist'),
      album: document.getElementById('album'),
      backgroundArt: document.getElementById('backgroundArt'),
      errorMessage: document.getElementById('errorMessage')
    };

    // Show error message
    function showError(message) {
      console.error('Error:', message);
      elements.errorMessage.textContent = message;
      elements.errorMessage.classList.add('visible');
      setTimeout(() => {
        elements.errorMessage.classList.remove('visible');
      }, 5000);
    }

    // Update the display with new track info
    function updateDisplay(trackData) {
      const { title, artist, album, artwork } = trackData;

      // Update text content
      elements.title.textContent = title || 'No track playing';
      elements.artist.textContent = artist || '';
      elements.album.textContent = album || '';

      // Show text with transitions
      requestAnimationFrame(() => {
        elements.title.classList.add('visible');
        elements.artist.classList.add('visible');
        elements.album.classList.add('visible');
      });

      // Update artwork
      if (artwork) {
        const img = elements.artwork;
        const bgImg = elements.backgroundArt;

        img.classList.remove('loaded');
        bgImg.classList.remove('visible');

        img.onload = function() {
          img.classList.add('loaded');
        };

        img.onerror = function() {
          console.error('Failed to load artwork');
          img.src = '';
        };

        bgImg.onload = function() {
          bgImg.classList.add('visible');
        };

        // Set both images to same source
        img.src = artwork;
        bgImg.src = artwork;
      } else {
        elements.artwork.src = '';
        elements.artwork.classList.remove('loaded');
        elements.backgroundArt.src = '';
        elements.backgroundArt.classList.remove('visible');
      }
    }

    // Fetch current playing track from Home Assistant via NGINX proxy
    async function fetchNowPlaying() {
      if (isUpdating) return;
      isUpdating = true;

      try {
        const response = await fetch(`${CONFIG.API_PATH}/states/${CONFIG.ENTITY}`, {
          headers: {
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();

        // Check if media player is available
        if (data.state === 'unavailable') {
          throw new Error('Media player is unavailable');
        }

        const trackData = {
          title: data.attributes.media_title || 'No track playing',
          artist: data.attributes.media_artist || '',
          album: data.attributes.media_album_name || '',
          artwork: data.attributes.entity_picture 
            ? `${CONFIG.API_PATH}${data.attributes.entity_picture.replace('/api', '')}`
            : null
        };

        // Only update if track has changed
        const trackKey = `${trackData.title}-${trackData.artist}`;
        if (trackKey !== currentTrack) {
          currentTrack = trackKey;
          updateDisplay(trackData);
        }

      } catch (error) {
        showError(`Connection error: ${error.message}`);
        console.error('Fetch error:', error);

        // Retry with longer delay on error
        if (updateTimer) clearTimeout(updateTimer);
        updateTimer = setTimeout(fetchNowPlaying, CONFIG.RETRY_DELAY);
        isUpdating = false;
        return;
      }

      isUpdating = false;

      // Schedule next update
      if (updateTimer) clearTimeout(updateTimer);
      updateTimer = setTimeout(fetchNowPlaying, CONFIG.UPDATE_INTERVAL);
    }

    // Initialize
    function init() {
      console.log('Initializing Now Playing display...');
      console.log('Configuration:', {
        apiPath: CONFIG.API_PATH,
        entity: CONFIG.ENTITY,
        devMode: CONFIG.DEV_MODE
      });

      // Use static test data in dev mode
      if (CONFIG.DEV_MODE) {
        console.log('DEV MODE: Using static test data');
        updateDisplay(CONFIG.DEV_DATA);
        return;
      }

      fetchNowPlaying();
    }

    // Start when page loads
    window.addEventListener('load', init);

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (updateTimer) clearTimeout(updateTimer);
    });
  </script>
</body>
</html>
