<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Playing - Music Assistant</title>

  <script>
    // ============================================
    // CONFIGURATION - Edit these values as needed
    // ============================================

    // Set to true to use test data without Music Assistant connection
    const DEV_MODE = false;

    // Music Assistant Personal Access Token (PAT). Unlike Home Assistant's
    // REST API, MA's WebSocket auth requires the client itself to send an
    // in-band "auth" command after connecting -- this cannot be injected by
    // a reverse proxy (NGINX only sees raw frames, not the JSON protocol
    // inside them), so the token must be configured here.
    const MA_ACCESS_TOKEN = ''

    // Music Assistant player ID (e.g., 'sonos_roam' or full player_id from MA)
    const PLAYER_ID = ''

    // NGINX Proxy Manager custom location path for Music Assistant
    // (proxies both the WebSocket at {API_PATH}/ws and REST endpoints like
    // {API_PATH}/imageproxy through to the MA server). Same-origin/relative
    // so the browser automatically uses wss:/https: when the page is served
    // over TLS, avoiding mixed-content connection failures. This only
    // handles routing/upgrade -- it does NOT (and cannot) inject the auth
    // token; see MA_ACCESS_TOKEN above and README.md for details.
    const API_PATH = '/api/ma';

    // ============================================
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Blurred album art background */
    .background-blur {
      position: fixed;
      top: -10%;
      left: -10%;
      right: -10%;
      bottom: -10%;
      z-index: 0;
      overflow: hidden;
    }

    .background-blur img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(60px) saturate(1.4) brightness(0.6);
      transform: scale(1.1);
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .background-blur img.visible {
      opacity: 0.6;
    }

    /* Subtle slow-moving animation for the background */
    .background-blur img.visible {
      animation: slowDrift 30s ease-in-out infinite;
    }

    @keyframes slowDrift {
      0%, 100% { transform: scale(1.1) translate(0, 0); }
      25% { transform: scale(1.15) translate(2%, -1%); }
      50% { transform: scale(1.1) translate(-1%, 2%); }
      75% { transform: scale(1.12) translate(-2%, -1%); }
    }

    /* Dark overlay for better contrast */
    .background-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
      z-index: 0;
    }

    /* Main content container */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 90vw;
      padding: 20px;
    }

    /* Album art container */
    .artwork-container {
      width: min(50vh, 80vw);
      height: min(50vh, 80vw);
      margin: 0 auto 40px;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      background: #1a1a1a;
    }

    .artwork-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .artwork-container img.loaded {
      opacity: 1;
    }

    /* Track info */
    .track-title {
      font-size: clamp(24px, 4vw, 48px);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      line-height: 1.2;
      opacity: 0;
      transition: opacity 0.5s ease 0.2s;
    }

    .track-title.visible {
      opacity: 1;
    }

    .track-artist {
      font-size: clamp(18px, 3vw, 32px);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.5s ease 0.3s;
    }

    .track-artist.visible {
      opacity: 1;
    }

    .track-album {
      font-size: clamp(16px, 2.5vw, 26px);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.65);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.5s ease 0.4s;
    }

    .track-album.visible {
      opacity: 1;
    }

    /* Loading state */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.5);
      font-size: 18px;
    }

    /* Error state */
    .error-message {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 0, 0, 0.2);
      border: 1px solid rgba(255, 0, 0, 0.5);
      color: #fff;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      z-index: 1000;
    }

    .error-message.visible {
      display: block;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }

      .artwork-container {
        margin-bottom: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="background-blur" id="backgroundBlur">
    <img id="backgroundArt" alt="">
  </div>
  <div class="background-overlay"></div>

  <div class="container">
    <div class="artwork-container">
      <img id="artwork" alt="Album artwork" crossorigin="anonymous">
    </div>
    <div class="track-title" id="title">Track title</div>
    <div class="track-artist" id="artist">Artist</div>
    <div class="track-album" id="album">Album title</div>
  </div>

  <div class="error-message" id="errorMessage"></div>

  <script>
    // Internal configuration (uses values from top of file)
    const CONFIG = {
      WS_URL: `${API_PATH}/ws`,
      BASE_URL: API_PATH,
      PLAYER_ID: PLAYER_ID,
      ACCESS_TOKEN: MA_ACCESS_TOKEN,
      UPDATE_INTERVAL: 5000,
      RECONNECT_DELAY: 5000, // milliseconds on disconnect

      // Development mode - uses value from top of file
      DEV_MODE: DEV_MODE,
      DEV_DATA: {
        title: 'Test Track Title',
        artist: 'Test Artist',
        album: 'Test Album',
        // Using a public domain album art for testing
        artwork: 'https://picsum.photos/seed/jazz/500/500'
      }
    };

    // State management
    let currentTrack = null;
    let websocket = null;
    let reconnectTimer = null;
    let messageId = 0;
    let authMessageId = null;
    let updateTimer = null;

    // DOM elements
    const elements = {
      artwork: document.getElementById('artwork'),
      title: document.getElementById('title'),
      artist: document.getElementById('artist'),
      album: document.getElementById('album'),
      backgroundArt: document.getElementById('backgroundArt'),
      errorMessage: document.getElementById('errorMessage')
    };

    // Show error message
    function showError(message) {
      console.error('Error:', message);
      elements.errorMessage.textContent = message;
      elements.errorMessage.classList.add('visible');
      setTimeout(() => {
        elements.errorMessage.classList.remove('visible');
      }, 5000);
    }

    // Get next message ID for WebSocket commands
    function getNextMessageId() {
      return ++messageId;
    }

    // Build image URL from a Music Assistant MediaItemImage object.
    // As of API schema 28+, MediaItemImage no longer exposes a ready-to-use
    // `url` field. Instead it provides `path` + `provider`, and a boolean
    // `remotely_accessible` flag:
    //   - remotely_accessible === true  -> `path` is already a direct,
    //     publicly fetchable URL (e.g. hosted by the provider/CDN).
    //   - remotely_accessible === false -> `path` is an internal/provider
    //     specific reference that must be resolved through the server's
    //     `/imageproxy?path=...&provider=...` endpoint.
    function buildImageUrl(imageData) {
      if (!imageData || !imageData.path) return null;

      if (imageData.remotely_accessible) {
        return addAccessTokenToUrl(imageData.path);
      }

      const proxyUrl = `${CONFIG.BASE_URL}/imageproxy?path=${encodeURIComponent(imageData.path)}&provider=${encodeURIComponent(imageData.provider || '')}`;
      return addAccessTokenToUrl(proxyUrl);
    }

    function addAccessTokenToUrl(url) {
      if (!CONFIG.ACCESS_TOKEN) return url;

      try {
        const parsedUrl = new URL(url, window.location.origin);
        if (!parsedUrl.searchParams.has('access_token')) {
          parsedUrl.searchParams.set('access_token', CONFIG.ACCESS_TOKEN);
        }
        return parsedUrl.toString();
      } catch (error) {
        const separator = url.includes('?') ? '&' : '?';
        if (url.includes('access_token=')) return url;
        return `${url}${separator}access_token=${encodeURIComponent(CONFIG.ACCESS_TOKEN)}`;
      }
    }

    function buildWebSocketUrl(baseUrl) {
      if (!CONFIG.ACCESS_TOKEN) return baseUrl;

      try {
        const parsedUrl = new URL(baseUrl, window.location.origin);
        if (!parsedUrl.searchParams.has('access_token')) {
          parsedUrl.searchParams.set('access_token', CONFIG.ACCESS_TOKEN);
        }
        return parsedUrl.toString();
      } catch (error) {
        const separator = baseUrl.includes('?') ? '&' : '?';
        if (baseUrl.includes('access_token=')) return baseUrl;
        return `${baseUrl}${separator}access_token=${encodeURIComponent(CONFIG.ACCESS_TOKEN)}`;
      }
    }

    // Extract track data from Music Assistant queue item
    function extractTrackData(queueItem) {
      if (!queueItem || !queueItem.media_item) {
        return null;
      }

      const mediaItem = queueItem.media_item;
      
      // Get artist name(s)
      let artist = '';
      if (mediaItem.artists && mediaItem.artists.length > 0) {
        artist = mediaItem.artists.map(a => a.name).join(', ');
      } else if (mediaItem.artist) {
        artist = typeof mediaItem.artist === 'string' ? mediaItem.artist : mediaItem.artist.name;
      }

      // Get album name
      let album = '';
      if (mediaItem.album) {
        album = typeof mediaItem.album === 'string' ? mediaItem.album : mediaItem.album.name;
      }

      // Get artwork URL.
      // Note: Track objects no longer carry a top-level `image` field; artwork
      // now lives in `metadata.images[]`. QueueItem still has its own `image`
      // as a fallback (e.g. for radio streams without track metadata).
      let artwork = null;
      if (mediaItem.metadata?.images && mediaItem.metadata.images.length > 0) {
        artwork = buildImageUrl(mediaItem.metadata.images[0]);
      } else if (queueItem.image) {
        artwork = buildImageUrl(queueItem.image);
      }

      return {
        title: mediaItem.name || 'Unknown Track',
        artist: artist,
        album: album,
        artwork: artwork
      };
    }

    // Update the display with new track info
    function updateDisplay(trackData) {
      const { title, artist, album, artwork } = trackData;

      // Update text content
      elements.title.textContent = title || 'No track playing';
      elements.artist.textContent = artist || '';
      elements.album.textContent = album || '';

      // Show text with transitions
      requestAnimationFrame(() => {
        elements.title.classList.add('visible');
        elements.artist.classList.add('visible');
        elements.album.classList.add('visible');
      });

      // Update artwork
      if (artwork) {
        const img = elements.artwork;
        const bgImg = elements.backgroundArt;

        img.classList.remove('loaded');
        bgImg.classList.remove('visible');

        img.onload = function() {
          img.classList.add('loaded');
        };

        img.onerror = function() {
          console.error('Failed to load artwork:', artwork);
          img.src = '';
        };

        bgImg.onload = function() {
          bgImg.classList.add('visible');
        };

        // Set both images to same source
        img.src = artwork;
        bgImg.src = artwork;
      } else {
        elements.artwork.src = '';
        elements.artwork.classList.remove('loaded');
        elements.backgroundArt.src = '';
        elements.backgroundArt.classList.remove('visible');
      }
    }

    // Send a command to Music Assistant via WebSocket
    function sendCommand(command, args = {}) {
      if (!websocket || websocket.readyState !== WebSocket.OPEN) {
        console.error('WebSocket not connected');
        return null;
      }

      const msgId = getNextMessageId();
      const message = {
        message_id: msgId,
        command: command
      };

      if (args && Object.keys(args).length > 0) {
        message.args = args;
      }

      console.log('Sending command:', message);
      websocket.send(JSON.stringify(message));
      return msgId;
    }

    function startPolling() {
      if (updateTimer) return;
      updateTimer = setInterval(requestPlayerState, CONFIG.UPDATE_INTERVAL);
    }

    function stopPolling() {
      if (updateTimer) {
        clearInterval(updateTimer);
        updateTimer = null;
      }
    }

    // Authenticate the WebSocket session using a PAT. This is mandatory --
    // MA's WebSocket API requires the client to send this in-band "auth"
    // command after connecting (it cannot be authenticated by NGINX/a
    // reverse proxy, since that would require understanding the JSON
    // protocol running inside the WebSocket, not just the HTTP
    // handshake/headers).
    function sendAuth() {
      if (!CONFIG.ACCESS_TOKEN) return null;
      if (!websocket || websocket.readyState !== WebSocket.OPEN) return null;

      const msgId = getNextMessageId();
      const message = {
        message_id: msgId,
        command: 'auth',
        args: {
          token: CONFIG.ACCESS_TOKEN
        }
      };

      console.log('Sending auth command');
      websocket.send(JSON.stringify(message));
      authMessageId = msgId;
      return msgId;
    }

    // Request current player queue state
    function requestPlayerState() {
      // Get the player's active queue
      sendCommand('player_queues/get_active_queue', {
        player_id: CONFIG.PLAYER_ID
      });
    }

    // Handle incoming WebSocket messages
    function handleMessage(event) {
      try {
        const data = JSON.parse(event.data);
        console.log('Received:', data);

        // Handle different message types
        if (data.event) {
          // This is an event notification
          handleEvent(data);
        } else if (data.result !== undefined) {
          // This is a response to a command
          handleCommandResponse(data);
        }
      } catch (error) {
        console.error('Error parsing message:', error);
      }
    }

    // Handle event notifications from Music Assistant
    function handleEvent(data) {
      const eventType = data.event;
      const eventData = data.data || {};

      // Listen for queue updates that affect our player
      if (eventType === 'queue_updated' || eventType === 'queue_item_updated') {
        if (eventData.queue_id === CONFIG.PLAYER_ID || 
            eventData.player_id === CONFIG.PLAYER_ID) {
          // Request fresh state when queue changes
          requestPlayerState();
        }
      }

      // Listen for player state changes
      if (eventType === 'player_updated') {
        if (eventData.player_id === CONFIG.PLAYER_ID) {
          requestPlayerState();
        }
      }
    }

    // Handle command responses
    function handleCommandResponse(data) {
      if (data.error_code === 20) {
        console.warn('Authentication required. Sending auth command.');
        sendAuth();
        return;
      }

      // Note: the server echoes message_id back as a string even when we
      // send it as a number, so compare loosely/stringified.
      if (authMessageId && String(data.message_id) === String(authMessageId)) {
        console.log('Auth response received');
      }

      // Response to player_queues/get_active_queue is a PlayerQueue object
      // (not a Player), with the current track under `current_item`.
      // Note: the Player object itself has no `current_item`/track info, so
      // there is no useful fallback via a players list response here.
      if (data.result && data.result.current_item) {
        const trackData = extractTrackData(data.result.current_item);

        if (trackData) {
          // Only update if track has changed
          const trackKey = `${trackData.title}-${trackData.artist}`;
          if (trackKey !== currentTrack) {
            currentTrack = trackKey;
            updateDisplay(trackData);
          }
        }
      }
    }

    // Connect to Music Assistant WebSocket
    function connectWebSocket() {
      const wsUrl = buildWebSocketUrl(CONFIG.WS_URL);
      console.log('Connecting to Music Assistant:', wsUrl);

      try {
        websocket = new WebSocket(wsUrl);

        websocket.onopen = function() {
          console.log('WebSocket connected');

          sendAuth();

          // As of the current API, event notifications (e.g. player_updated,
          // queue_updated) are pushed automatically once connected/authenticated
          // -- there is no separate "subscribe_events" command to send. We still
          // run a low-frequency polling fallback as a safety net in case an
          // event is ever missed.
          setTimeout(() => {
            requestPlayerState();
            startPolling();
          }, 300);
        };

        websocket.onmessage = handleMessage;

        websocket.onerror = function(error) {
          console.error('WebSocket error:', error);
          showError('Connection error');
        };

        websocket.onclose = function(event) {
          console.log('WebSocket closed:', event.code, event.reason);
          websocket = null;
          stopPolling();

          // Attempt to reconnect
          if (reconnectTimer) clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(() => {
            console.log('Attempting to reconnect...');
            connectWebSocket();
          }, CONFIG.RECONNECT_DELAY);
        };

      } catch (error) {
        console.error('Failed to create WebSocket:', error);
        showError(`Connection failed: ${error.message}`);
        
        // Retry connection
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectWebSocket, CONFIG.RECONNECT_DELAY);
      }
    }

    // Initialize
    function init() {
      console.log('Initializing Now Playing display (Music Assistant)...');
      console.log('Configuration:', {
        wsUrl: CONFIG.WS_URL,
        baseUrl: CONFIG.BASE_URL,
        playerId: CONFIG.PLAYER_ID,
        devMode: CONFIG.DEV_MODE
      });

      // Use static test data in dev mode
      if (CONFIG.DEV_MODE) {
        console.log('DEV MODE: Using static test data');
        updateDisplay(CONFIG.DEV_DATA);
        return;
      }

      if (!CONFIG.ACCESS_TOKEN) {
        showError('Missing Music Assistant access token (PAT).');
        return;
      }

      connectWebSocket();
    }

    // Start when page loads
    window.addEventListener('load', init);

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      if (websocket) {
        websocket.close();
      }
      stopPolling();
    });
  </script>
</body>
</html>
