location /api/ha/ {
    # Rewrite path to remove /api/ha prefix
    rewrite ^/api/ha/(.*)$ /api/$1 break;
    
    # Proxy to Home Assistant
    proxy_pass http://10.0.1.10:8123;
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # *** INJECT HOME ASSISTANT TOKEN HERE ***
    proxy_set_header Authorization "Bearer <HA_TOKEN_HERE>";
    
    # WebSocket support (needed for HA event stream if you add that later)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeout settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
